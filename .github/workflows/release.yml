name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          echo "package_version=$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Build and verify distributions
        run: |
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/curbshade-release
          /tmp/curbshade-release/bin/python -m pip install dist/*.whl
          /tmp/curbshade-release/bin/python -m pip check
          /tmp/curbshade-release/bin/curbshade-schema --out /tmp/network.schema.json
          /tmp/curbshade-release/bin/python -m json.tool /tmp/network.schema.json >/dev/null
          python scripts/build_demo.py > /tmp/demo.json
          /tmp/curbshade-release/bin/curbshade-validate /tmp/demo.json
          /tmp/curbshade-release/bin/curbshade-profile /tmp/demo.json --json > /tmp/coverage.json
          /tmp/curbshade-release/bin/python -m json.tool /tmp/coverage.json >/dev/null
      - name: Verify changelog and checksums
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          grep -Eq "^## ${version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: curbshade-data-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
