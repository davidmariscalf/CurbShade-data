name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: curbshade-data-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: python -m compileall -q src scripts tests
      - run: pytest -q
      - run: python scripts/build_demo.py > /tmp/demo.json
      - run: python scripts/validate.py /tmp/demo.json
      - run: curbshade-validate /tmp/demo.json
      - run: python scripts/profile_coverage.py /tmp/demo.json --json > /tmp/coverage.json
      - run: curbshade-profile /tmp/demo.json --json > /tmp/coverage-cli.json
      - run: python -m json.tool /tmp/coverage.json >/dev/null
      - name: Packaged schema smoke test
        run: |
          curbshade-schema --out /tmp/network.schema.json
          python -m json.tool /tmp/network.schema.json >/dev/null

  osmnx-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[osm]"
      - run: python -m pip check
      - run: python -c "import osmnx; assert osmnx.__version__ >= '2.1.1'; print(osmnx.__version__)"
      - run: curbshade-fetch-osm --help >/dev/null

  opensidewalks-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[osw]"
      - run: python -m pip check
      - name: Verify official OpenSidewalks validator integration
        run: |
          python -c "from python_osw_validation import OSWValidation; print(OSWValidation)"
          python scripts/validate_osw.py --help >/dev/null
          curbshade-validate-osw --help >/dev/null

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build
          python -m twine check dist/*
      - name: Install built wheel in an isolated environment
        run: |
          python -m venv /tmp/curbshade-wheel
          /tmp/curbshade-wheel/bin/python -m pip install dist/*.whl
          /tmp/curbshade-wheel/bin/curbshade-schema --out /tmp/network.schema.json
          /tmp/curbshade-wheel/bin/python -m json.tool /tmp/network.schema.json >/dev/null
          /tmp/curbshade-wheel/bin/curbshade-validate --help >/dev/null
          /tmp/curbshade-wheel/bin/curbshade-profile --help >/dev/null
          /tmp/curbshade-wheel/bin/curbshade-fetch-osm --help >/dev/null
          /tmp/curbshade-wheel/bin/curbshade-validate-osw --help >/dev/null
