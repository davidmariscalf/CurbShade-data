name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: curbshade-data-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m pip check
      - run: python -m compileall -q scripts tests
      - run: pytest -q
      - run: python scripts/build_demo.py > /tmp/demo.json
      - run: python scripts/validate.py /tmp/demo.json
      - run: python scripts/profile_coverage.py /tmp/demo.json --json > /tmp/coverage.json
      - run: python -m json.tool /tmp/coverage.json >/dev/null

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[osm,osw]"
      - run: python -m pip check
      - name: Verify OSMnx integration
        run: python -c "import osmnx; print(osmnx.__version__)"
      - name: Verify OpenSidewalks validator integration
        run: |
          python -c "from python_osw_validation import OSWValidation; print(OSWValidation)"
          python scripts/validate_osw.py --help >/dev/null
