name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curbshade-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ["core", "osm", "osw"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audited profile
        shell: bash
        run: |
          case "${{ matrix.profile }}" in
            core) python -m pip install . ;;
            osm) python -m pip install ".[osm]" ;;
            osw) python -m pip install ".[osw]" ;;
          esac
      - name: Audit known vulnerabilities
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit --local --skip-editable
